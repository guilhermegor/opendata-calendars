[tool.poetry]
name = "opendata-calendars"
version = "0.0.1"
description = "Fetch exchange and bank holiday calendars from their publishers (B3, ANBIMA, FEBRABAN, NASDAQ, US federal), with cache and provenance, returned as purecalendars calendars"
authors = ["guilhermegor"]
readme = "README.md"
license = "MIT"
homepage = "https://github.com/guilhermegor/opendata-calendars"
repository = "https://github.com/guilhermegor/opendata-calendars"
keywords = ["opendata-calendars", "python", "library"]
packages = [{ include = "opendata_calendars", from = "src" }]
exclude = ["src/**/CLAUDE.md"]
package-mode = true
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: MIT License",
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries",
]

[tool.poetry.urls]
"Bug Reports" = "https://github.com/guilhermegor/opendata-calendars/issues"
"Source" = "https://github.com/guilhermegor/opendata-calendars"

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
purecalendars = ">=4.0.1,<5"
beartype = ">=0.22"
pandas = ">=2.1.0"
numpy = ">=1.22"
requests = ">=2.32"
lxml = ">=5.0"
xlrd = ">=2.0.2"
defusedxml = ">=0.7"
playwright = { version = ">=1.40", optional = true }

[tool.poetry.extras]
web = ["playwright"]

[tool.poetry.group.dev.dependencies]
poethepoet = ">=0.35"
pre-commit = ">=4.1.0"
pretty-errors = ">=1.2.25"
commitizen = ">=4.4.1"
build = ">=1.2.2"
twine = ">=6.1.0"
ruff = ">=0.11.13,<0.12"
codespell = ">=2.4.1"
pydocstyle = ">=6.3.0"
pytest = ">=8.0.0"
pytest-cov = ">=6.0.0"
pytest-randomly = ">=3.15.0"
coverage = ">=7.6.0"
genbadge = {extras = ["coverage"], version = ">=1.1.0"}
mypy = ">=1.8.0"
sqlfluff = ">=3.0.0"
yamllint = ">=1.35.0"
shfmt-py = ">=3.7.0"
shellcheck-py = ">=0.10.0"
deptry = ">=0.20"
lxml-stubs = "^0.5.1"
pytest-mock = ">=3.14"

[tool.poetry.group.docs.dependencies]
mkdocs = ">=1.6.0"
mkdocs-material = ">=9.5.0"
pymdown-extensions = ">=10.0"
mike = ">=2.1.0"

[tool.deptry.per_rule_ignores]
DEP002 = ["xlrd"]

[build-system]
requires = ["poetry-core>=1.7.0"]
build-backend = "poetry.core.masonry.api"
